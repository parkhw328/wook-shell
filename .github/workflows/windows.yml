name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS only when explicitly requested (Windows focus)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build, test core, and package
        shell: powershell
        run: ./scripts/build.ps1 -Bootstrap
      - name: Install SSH test fixture
        run: npm --prefix tests/ssh ci --ignore-scripts --omit=optional
      - name: Test private font cache and concurrent startup
        run: node tests/ssh/font-integration.cjs
      - name: Test SSH launch arguments and one-use passwords
        run: node tests/ssh/launch-integration.cjs
      - name: Test private key import, registration and SSH signatures
        run: node tests/ssh/key-import-integration.cjs
      - name: Test SSH and hosted native windows
        run: node tests/ssh/integration.cjs
      - name: Test SFTP transfers and cancellation
        run: node tests/ssh/sftp-integration.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wshell-windows-x64
          path: |
            dist/*/windows-x64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-test-evidence
          path: |
            build/ssh-test-*/standalone/ui-*.bmp
            build/ssh-test-*/standalone/ui-smoke-result.json
            build/ssh-test-*/standalone/ui-smoke-progress.json
            build/ssh-test-*/standalone/focus-*.json
            build/ssh-test-*/standalone/font-picker.json
            build/ssh-test-*/standalone/settings-*.json
            build/ssh-test-*/authentication.json
            build/ssh-test-*/result.json
            build/font-test-*/result.json
            build/launch-test-*/result.json
            build/key-import-*/result.json
          if-no-files-found: ignore
  macos:
    # Paused while focusing on Windows; allow an explicit manual opt-in.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and test universal app
        run: python3 scripts/build-mac.py
      - name: Install SSH fixture
        run: npm --prefix tests/ssh ci --ignore-scripts --omit=optional
      - name: Test AppKit, local PTY, public-key and Keychain password SSH
        run: node tests/ssh/mac-integration.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wshell-macos-universal
          path: dist/*/macos-universal/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-test-evidence
          path: |
            build/mac-evidence/*.png
            build/mac-evidence/*result.json
            mac/Package.resolved
          if-no-files-found: ignore
