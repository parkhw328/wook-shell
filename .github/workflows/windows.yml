name: Windows portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build, test core, and package
        shell: powershell
        run: ./scripts/build.ps1 -Bootstrap
      - name: Install SSH test fixture
        run: npm --prefix tests/ssh ci --ignore-scripts --omit=optional
      - name: Test SSH and hosted native windows
        run: node tests/ssh/integration.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wshell-win-x64
          path: |
            dist/wShell.exe
            dist/wShell.exe.sha256
            dist/wshell-*-win-x64.zip
            dist/wshell-*-win-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-evidence
          path: |
            build/ssh-test-*/standalone/ui-*.bmp
            build/ssh-test-*/standalone/ui-smoke-result.json
            build/ssh-test-*/standalone/ui-smoke-progress.json
            build/ssh-test-*/standalone/settings-*.json
            build/ssh-test-*/authentication.json
            build/ssh-test-*/result.json
          if-no-files-found: ignore
